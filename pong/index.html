<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="src/Pong_ico.png">
    <title>Pong-Game>Menu</title>
    <script src="settings.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="topButtons">
        <a id="play" href="game.html">Play</a>
        <button type="button" onclick="saveSettings()">Save</button>
    </div>

    <label for="singlep">Single player: </label>
    <input type="checkbox" id="singlep" name="singlep" value="checked" onchange="saveSettings()">

    <h2>Settings</h2>
        <div id="settings">
        <label for="sens">Senstitivity: </label>
        <input type="text" id="sens" name="sens" value="20" onchange="saveSettings()">
        <label for="bspeed">Ball speed: </label>
        <input type="text" id="bspeed" name="bspeed" value="8" onchange="saveSettings()">
        <label for="gspeed">Game speed/refresh rate: </label>
        <input type="text" id="gspeed" name="gspeed" value="270" onchange="saveSettings()">
        <label for="mscore">Max score: </label>
        <input type="text" id="mscore" name="mscore" value="10" onchange="saveSettings()">
        <label for="mtime">Max time: </label>
        <input type="text" id="mtime" name="mtime" value="-1" onchange="saveSettings()">
        <label for="aispeed">AI speed: </label>
        <input type="text" id="aispeed" name="aispeed" value="3.25" onchange="saveSettings()">
    </div>

    <div id="instructions">
        <h1>Controls</h1>
        <h5>Enter/Space: start/pause the game</h5>
        <h4>First player</h4>
        <h5>W: up</h5>
        <h5>S: down</h5>
        <h4>Second player (default in single player)</h4>
        <h5>PgUp (arrow up): up</h5>
        <h5>PgDn (arrow down): down</h5>
    </div>
</body>
</html>
